; Smart roller blinds firmware
;
; Main firmware:
;   pio run -e blinds -t upload -t monitor        (USB)
;   pio run -e blinds-ota -t upload               (over WiFi, after first flash)
;
; Hardware / module test firmwares (see scripts/test.sh and README.md):
;   ./scripts/test.sh <knob|encoder|motor|closed_loop|display|ui|web|net|sim>
;
; On-device unit tests (pure logic, no wiring needed):
;   pio test -e unit

[platformio]
default_envs = blinds

[env]
platform = espressif32@8.0.0
board = fm-devkit
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
	-std=gnu++17
	-Os
	-Iinclude
	-Wall
	-Wno-unused-function
	-DFW_VERSION=\"2.0.0\"
lib_ldf_mode = chain
lib_deps =
	lovyan03/LovyanGFX@^1.2.19
	gin66/FastAccelStepper@1.2.7
	robtillaart/AS5600@^0.6.7
	teemuatlut/TMCStepper@^0.7.3
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------- main firmware
[env:blinds]
build_src_filter = +<app/>

[env:blinds-ota]
extends = env:blinds
upload_protocol = espota
upload_port = blinds.local
; must match Settings::otaPassword (default: "blinds")
upload_flags = --auth=blinds

; ------------------------------------------------------------ module test apps
; One environment for all hardware/module tests; the sketch is picked with the
; TEST variable (see scripts/select_test.py and scripts/test.sh):
;   TEST=knob pio run -e test -t upload -t monitor
;   ./scripts/test.sh knob
; Tests: knob encoder motor closed_loop display ui web net sim
[env:test]
extra_scripts = pre:scripts/select_test.py

; ------------------------------------------------------- on-device unit tests
[env:unit]
build_src_filter = -<*>
test_framework = unity
